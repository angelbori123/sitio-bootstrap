<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto | Taller Norte</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand marca" href="index.html">TALLER NORTE</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="portafolio.html">Portafolio</a></li>
            <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
  <main class="container py-5">
    <div class="row">
      <div class="col-lg-7">
        <h1>Contacto</h1>
        <form class="needs-validation" novalidate>
          <div class="mb-3"><label class="form-label">Nombre</label><input class="form-control" required><div class="invalid-feedback">Escribe tu nombre.</div></div>
          <div class="mb-3"><label class="form-label">Correo</label><input class="form-control" type="email" required><div class="invalid-feedback">Escribe un correo válido.</div></div>
          <div class="mb-3"><label class="form-label">Mensaje</label><textarea class="form-control" required></textarea><div class="invalid-feedback">Escribe un mensaje.</div></div>
          <button class="btn btn-cafe" type="submit">Enviar</button>
        </form>
      </div>
      <aside class="col-lg-5">
        <h2>Datos</h2>
        <p>Correo: hola@tallernorte.example</p>
        <p>Teléfono: (787) 555-0148</p>
      </aside>
    </div>
  </main>
  <footer class="py-3 text-center"><p class="mb-0">Contacto ficticio</p></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    var f = document.querySelector("form");
    f.addEventListener("submit", function (e) { e.preventDefault(); f.classList.add("was-validated"); });
  </script>
</body>
</html>
